<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { padding: 2rem; background: #f4f6f8; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #1e293b; margin-bottom: 1.5rem; text-align: center; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
    input { padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
    button.btn-add { grid-column: span 2; padding: 0.8rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    button.btn-add:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f1f5f9; color: #475569; }
    .btn-delete { background: #ef4444; padding: 0.4rem 0.8rem; border-radius: 4px; color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-delete:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Management System</h1>
    <form id="student-form">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="text" id="course" placeholder="Course Name" required />
      <input type="text" id="grade" placeholder="Grade (e.g. A, B+)" required />
      <button type="submit" class="btn-add">Add Student</button>
    </form>

    <h2>Student Directory</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Grade</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="student-table-body"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "http://localhost:5000/api/students";

    async function fetchStudents() {
      try {
        const res = await fetch(API_URL);
        const students = await res.json();
        const tbody = document.getElementById("student-table-body");
        tbody.innerHTML = "";
        students.forEach((s) => {
          tbody.innerHTML += `
            <tr>
              <td>${s.name}</td>
              <td>${s.email}</td>
              <td>${s.course}</td>
              <td>${s.grade}</td>
              <td><button class="btn-delete" onclick="deleteStudent('${s.id}')">Delete</button></td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Error connecting to backend server:", err);
      }
    }

    document.getElementById("student-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const course = document.getElementById("course").value;
      const grade = document.getElementById("grade").value;

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, course, grade })
      });

      document.getElementById("student-form").reset();
      fetchStudents();
    });

    async function deleteStudent(id) {
      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      fetchStudents();
    }

    fetchStudents();
  </script>
</body>
</html>
